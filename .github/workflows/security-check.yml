# .github/workflows/security-check.yml
name: Source Code Security Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install dependencies (Python project)
      - name: Install dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pip-audit semgrep

      # Run pip-audit (for Python dependencies)
      - name: Run pip-audit (non-blocking)
        run: pip-audit --progress-spinner=off || true

      # Run Semgrep static analysis (for common vuln patterns)
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/ci"

      # Optional: Solidity static analysis with Slither
      - name: Run Slither for smart contracts
        if: ${{ hashFiles('contracts/**/*.sol') != '' }}
        uses: crytic/slither-action@v0.2.0
        with:
          target: "./contracts"
          
      # OWASP Dependency Check
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "OKSwap"
          path: "."
          format: "HTML"
          out: "reports"
      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-report
          path: reports
