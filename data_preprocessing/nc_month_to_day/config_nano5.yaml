root_dir: "/work/jasjou71/data/ERA5_nc_monthly" # ERA5 月份 NetCDF 檔案的根目錄路徑
output_dir: "/work/jasjou71/data/ERA5_nc_hourly" # 分割後的小時 NetCDF 檔案輸出目錄路徑
time_variable: "valid_time" # NetCDF 檔案中的時間變數名稱
workers: 20 # 用於並行處理的工作進程數量
dt_hours: 1 # 分割檔案的時間間隔 (單位：小時)
variables: # 需要處理的變數列表
  - "mslp"
  - "sp"
  - "tcwv"
  - "t2m"
  - "u10"
  - "v10"
  - "q1000"
  - "q850"
  - "q500"
  - "q250"
  - "t1000"
  - "t850"
  - "t500"
  - "t250"
  - "u1000"
  - "u850"
  - "u500"
  - "u250"
  - "v1000"
  - "v850"
  - "v500"
  - "v250"
  - "z1000"
  - "z850"
  - "z500"
  - "z250"

# 變數名稱對應表：檔案名稱中的變數 -> NetCDF 檔案中的實際變數名稱
# 當檔案名稱中的變數與 NetCDF 檔案中的實際變數名稱不同時使用此設定
variable_mapping:
  mslp: "msl"  # mslp 檔案包含變數 'msl'
  sp: "sp"
  tcwv: "tcwv"
  t2m: "t2m"
  u10: "u10"
  v10: "v10"
  q1000: "q"
  q850: "q"
  q500: "q"
  q250: "q"
  t1000: "t"
  t850: "t"
  t500: "t"
  t250: "t"
  u1000: "u"
  u850: "u"
  u500: "u"
  u250: "u"
  v1000: "v"
  v850: "v"
  v500: "v"
  v250: "v"
  z1000: "z"
  z850: "z"
  z500: "z"
  z250: "z"