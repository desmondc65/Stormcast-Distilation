# ---------------------------------------------------------------------------
# Inference settings
# ---------------------------------------------------------------------------
# For single-timestep inference, n_steps=1 means predict t+1 from t
n_steps: 9

# Time increment per step (hours)
dt_hours: 1

# ---------------------------------------------------------------------------
# I/O - Variable names matching inference_data_preprocess_config.yaml
# ---------------------------------------------------------------------------

# State variables (HighRes output from RWRF)
# Available: ['t2m', 'u10', 'v10', 'qpepre']
plot_var_state: "t2m"          # state variable to plot
output_state_channels: []       # state variables to save (empty == all channels)

# Background variables (LowRes from GRIB)
# Available: ['mslp', 't2m', 'u10', 'v10', 'q1000', 'q850', 'q500', 'q250',
#             't1000', 't850', 't500', 't250', 'u1000', 'u850', 'u500', 'u250',
#             'v1000', 'v850', 'v500', 'v250', 'z1000', 'z850', 'z500', 'z250']
plot_var_background: "t2m"     # background variable to plot

# Output format settings
output_format: "zarr"          # "zarr" or "netcdf"

# Variables for output (matching HighRes channels)
save_horizontal_vars: ["t2m", "u10", "v10", "qpepre"]

# For backward compatibility (not used in NCDR inference)
save_vertical_vars: []
save_vertical_levels: []
