# ---------------------------------------------------------------------------
# General inference config items
# ---------------------------------------------------------------------------
outdir: '/home/master/13/dczy/code/stormcast-ncdr/data/stormcast_nano5_inference/inference_output'
experiment_name: 'stormcast-ncdr-inference'
run_id: 0
rundir: ${inference.outdir}/${inference.experiment_name}/${inference.run_id}

# Model checkpoints
regression_checkpoint: /home/master/13/dczy/code/stormcast-ncdr/data/StormCast_nano5_same_6hrs/exp_3_reg_L_24_H_4_train_2_5_years_6hrs_same/1/checkpoints_regression/StormCastUNet.0.3000.mdlus
