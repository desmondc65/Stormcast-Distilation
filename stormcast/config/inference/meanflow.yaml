# ---------------------------------------------------------------------------
# MeanFlow inference config
# ---------------------------------------------------------------------------
outdir: 'StormCast_meanflow/inference'
experiment_name: 'meanflow-inference'
run_id: 0
rundir: ${inference.outdir}/${inference.experiment_name}/${inference.run_id}

# Initial autoregressive timestamp (must be present in dataset.valid_dates).
initial_time: '2022-07-01T00:00:00'

# Number of autoregressive steps (each is dt = 1 h).
n_steps: 12

# ---------------------------------------------------------------------------
# Checkpoints
# ---------------------------------------------------------------------------
# Frozen regression mean F_xi.
regression_checkpoint: ''

# MeanFlow student EMA shadow saved by trainer_meanflow.py at
#   <meanflow_train_rundir>/ema_state.pt
# Loading the EMA shadow (NOT the raw student) matches what trainer_meanflow
# uses for its own validation sampler.
meanflow_ema_path: ''

# ---------------------------------------------------------------------------
# MeanFlow sampler hyperparameters
# ---------------------------------------------------------------------------
meanflow:
  num_steps: 2         # average-velocity segments (NFE); 1 = one-step.

# ---------------------------------------------------------------------------
# I/O
# ---------------------------------------------------------------------------
plot_var_state: 'qpepre'           # variable to plot from state predictions
plot_var_background: 't2m'         # variable to plot from background
output_state_channels: []          # empty == all state channels

save_horizontal_vars: ['t2m', 'u10', 'v10', 'qpepre']
save_vertical_vars: []
save_vertical_levels: []
