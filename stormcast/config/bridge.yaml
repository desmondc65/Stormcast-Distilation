# Anchored Stochastic-Interpolant Bridge on the StormCast Taiwan residual.
# Direction 1 of flowcast_improvement.md.

defaults:

  # Dataset
  - dataset/era5_rwrf_qpepre

  # Model
  - model/bridge

  # Training
  - training/bridge

  # Sampler (not used at train time, kept for parity with the other configs).
  - sampler/edm_deterministic

  # Hydra
  - hydra/default

  - _self_

# Bridge-specific top-level overrides
model:
  use_regression_net: True
  regression_weights: ""
  spatial_pos_embed: True

training:
  loss: 'bridge'
  total_train_steps: 400000
  checkpoint_freq: 5000
  validation_freq: 500
