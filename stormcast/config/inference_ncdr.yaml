# Main configuration file for NCDR StormCast inference
# This config combines dataset, model, inference settings for single-timestep prediction

defaults:
  # Dataset - use inference-specific loader
  - dataset/inference

  # Model settings
  - model/regression

  # Inference settings  
  - inference/stormcast

  # Sampler for diffusion model
  - sampler/edm_deterministic

  # Hydra settings - use inference-specific config
  - hydra/inference

  - _self_
