# Model name
model_name: 'gsmeanflow'

# Model conditions (identical to MeanFlow: keep "regression" so mu_{t+1} is a
# conditioning channel for both the flow and the occurrence gate).
regression_conditions: ["state", "background", "invariant"]
diffusion_conditions: ["state", "regression", "invariant"]

# Model hyperparameters
spatial_pos_embed: False
attn_resolutions: []

# Pretrained regression model (used only as conditioning; not trained here).
regression_weights: ""

# GS-MeanFlow parameters.
# - sigma_data / time_scale: same convention as MeanFlow / FlowCast. Keep
#   matched to the EDM teacher so metrics stay comparable.
# - gate_base_channels: width of the lightweight occurrence-gate U-Net. Much
#   smaller than the SongUNet flow, so the gate is nearly free at inference.
sigma_data: 0.5
time_scale: 1000.0
gate_base_channels: 48
