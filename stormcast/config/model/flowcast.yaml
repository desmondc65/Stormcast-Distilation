# Model name
model_name: 'flowcast'

# Model conditions.
# - regression_conditions: inputs used by the frozen regression network.
# - diffusion_conditions: inputs concatenated with x_t for the CFM network
#   (keep "regression" so the mean M_t is available as a conditioning channel
#   and the CFM residual anchor stays aligned with the EDM teacher's setup).
regression_conditions: ["state", "background", "invariant"]
diffusion_conditions: ["state", "regression", "invariant"]

# Model hyperparameters
spatial_pos_embed: False
attn_resolutions: []

# Pretrained regression model (used only as conditioning; not trained here).
regression_weights: ""

# CFM parameters.
# - sigma_data is the standard deviation of the raw residual R_t and is used
#   to standardize inputs / de-standardize the sampler output. Keep matched
#   to the EDM teacher so metrics are directly comparable.
# - time_scale applies to the flow time t before it enters SongUNet's
#   positional embedding (diffusion-timestep range keeps enough resolution).
sigma_data: 0.5
time_scale: 1000.0
