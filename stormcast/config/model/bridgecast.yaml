# Model name
model_name: 'bridgecast'

# Conditioning bundles (same as FlowCast — keep "regression" so M_t enters as
# a conditioning channel AND drives the bridge anchor).
regression_conditions: ["state", "background", "invariant"]
diffusion_conditions: ["state", "regression", "invariant"]

# UNet hyperparameters
spatial_pos_embed: False
attn_resolutions: []

# Pretrained regression model (frozen).
regression_weights: ""

# Bridge parameters.
# - sigma_data: per-channel std for de-/standardization (match the EDM
#   teacher so qpepre statistics are comparable).
# - time_scale: scales bridge time t in [0,1] before SongUNet positional
#   embedding (same convention as FlowCast).
sigma_data: 0.5
time_scale: 1000.0
