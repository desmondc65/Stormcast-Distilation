# BridgeCast — mean-anchored Schrödinger bridge on the Taiwan RWRF residual
# (new_method_plan.md). Forks the FlowCast composition root.

defaults:

  # Dataset (same RWRF zarr as StormCast / FlowCast)
  - dataset/era5_rwrf_qpepre

  # Model
  - model/bridgecast

  # Training
  - training/bridgecast

  # Sampler placeholder (kept for parity; the BridgeCast sampler is the
  # bridgecast_model_forward() helper, not a Karras-schedule sampler).
  - sampler/edm_deterministic

  # Hydra
  - hydra/default

  - _self_

# BridgeCast-specific top-level overrides (kept thin: most knobs live in
# training/bridgecast.yaml).
model:
  use_regression_net: True
  regression_weights: ""
  spatial_pos_embed: True

training:
  loss: 'bridgecast'
  total_train_steps: 400000
  checkpoint_freq: 5000
  validation_freq: 500
