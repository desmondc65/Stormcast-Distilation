# General training config items
outdir: 'StormCast_gsmeanflow'
experiment_name: 'gsmeanflow'
run_id: '0'
rundir: ./${training.outdir}/${training.experiment_name}/${training.run_id}
num_data_workers: 4
log_to_wandb: False
wandb_mode: "online"
seed: -1
cudnn_benchmark: True
resume_checkpoint: "latest"
initial_weights: ""

# Logging frequency
print_progress_freq: 1
checkpoint_freq: 5000
validation_freq: 500

# Optimization hyperparameters. Kept identical to the MeanFlow / FlowCast
# students (AdamW, lr=5e-4, weight_decay=1e-4, 1% linear warmup into cosine
# decay) so GS-MeanFlow vs MeanFlow is a clean A/B on the two added pillars.
batch_size: 64
batch_size_per_gpu: "auto"
lr: 5E-4
weight_decay: 1.0E-4
adam_betas: [0.9, 0.999]
lr_warmup_steps: 4000          # ~1% of total_train_steps
min_lr_ratio: 0.01             # min_lr = lr * min_lr_ratio
total_train_steps: 400000
clip_grad_norm: 1.0
loss: 'gsmeanflow'
fp_optimizations: fp32
compile_model: False

# MeanFlow objective parameters (carried over unchanged).
t_eps: 1.0E-5                  # clamp for time samples ~ U(eps, 1-eps)
mf_ratio: 0.25                 # fraction of batch on the r < t identity
adaptive_p: 1.0                # adaptive weight w = 1/(mse + eps)^p; 0 = off
adaptive_eps: 1.0E-3
ema_decay: 0.999

# Sampler parameters used only for validation diagnostics.
valid_num_steps: 2            # average-velocity segments (NFE)

# Hybrid loss knobs (per-channel beta weights + qpepre log-PSD penalty). The
# group-decoupled adaptive weighting (Pillar 1) splits qpepre from the smooth
# channels automatically using the gate channel index.
channel_weights: [1.0, 1.0, 1.0, 2.0]   # (t2m, u10, v10, qpepre)
spectral_channels: ["qpepre"]
spectral_weight: 0.1

# Occurrence (hurdle) gate parameters (Pillar 2).
# - gate_threshold_mm: physical precip threshold defining "wet" (matches the
#   lowest CSI threshold used in the metrics suite).
# - gate_weight: weight on the focal-BCE occurrence term.
# - gate_focal_gamma / gate_focal_alpha: focal-loss focusing + positive-class
#   weighting (alpha > 0.5 emphasizes the sparse wet pixels).
# - gate_prob_threshold: wet-probability decision boundary used by the
#   validation sampler when forcing dry pixels to exact zero.
gate_threshold_mm: 0.1
gate_weight: 1.0
gate_focal_gamma: 2.0
gate_focal_alpha: 0.75
gate_prob_threshold: 0.5

# Validation options
validation_plot_variables: ["t2m", "u10", "v10", "qpepre"]

# Output nc
output_nc: False
output_nc_freq: 5
