# General training config items
outdir: 'StormCast_consistency'
experiment_name: 'cd_distillation'
run_id: '0'
rundir: ./${training.outdir}/${training.experiment_name}/${training.run_id}
num_data_workers: 4
log_to_wandb: False
wandb_mode: "online"
seed: -1
cudnn_benchmark: True
resume_checkpoint: "latest"
initial_weights: ""

# Logging frequency
print_progress_freq: 1
checkpoint_freq: 5000
validation_freq: 500

# Optimization hyperparameters
batch_size: 64
batch_size_per_gpu: "auto"
lr: 1E-4              # Lower LR than EDM training, typical for distillation
lr_rampup_steps: 500
total_train_steps: 400000
clip_grad_norm: 1.0
loss: 'consistency'
fp_optimizations: fp32
compile_model: False

# Consistency Distillation specific
N_0: 2                 # Initial discretization steps
N_total: 150           # Final discretization steps
rho: 7.0
huber_c: 0.00054       # Pseudo-Huber loss constant (from Song et al.)
ema_decay_init: 0.95   # mu_0 for EMA schedule

# Validation options
validation_plot_variables: ["t2m", "u10", "v10", "qpepre"]

# Output nc
output_nc: False
output_nc_freq: 5
