# General training config items
outdir: 'StormCast_flowcast'
experiment_name: 'flowcast_cfm'
run_id: '0'
rundir: ./${training.outdir}/${training.experiment_name}/${training.run_id}
num_data_workers: 4
log_to_wandb: False
wandb_mode: "online"
seed: -1
cudnn_benchmark: True
resume_checkpoint: "latest"
initial_weights: ""

# Logging frequency
print_progress_freq: 1
checkpoint_freq: 5000
validation_freq: 500

# Optimization hyperparameters (FlowCast paper defaults: AdamW, lr=5e-4,
# weight_decay=1e-4, 1% linear warmup into cosine decay to min_lr_ratio=1e-2).
batch_size: 64
batch_size_per_gpu: "auto"
lr: 5E-4
weight_decay: 1.0E-4
adam_betas: [0.9, 0.999]
lr_warmup_steps: 4000          # ~1% of total_train_steps
min_lr_ratio: 0.01             # min_lr = lr * min_lr_ratio
total_train_steps: 400000
clip_grad_norm: 1.0
loss: 'flowcast'
fp_optimizations: fp32
compile_model: False

# CFM objective parameters.
sigma_path: 0.01               # I-CFM probability-path std (FlowCast paper)
t_eps: 1.0E-5                  # clamp for t ~ U(eps, 1-eps)
ema_decay: 0.999               # FlowCast paper default

# Sampler parameters used only for validation diagnostics.
valid_num_steps: 10            # Euler steps at validation (paper default)
solver: 'euler'                # 'euler' or 'midpoint'

# Hybrid loss knobs (mirrors CD loss): per-channel β weights and an optional
# log-PSD penalty on qpepre to keep the heavy-tailed spectrum calibrated.
channel_weights: [1.0, 1.0, 1.0, 2.0]   # (t2m, u10, v10, qpepre)
spectral_channels: ["qpepre"]
spectral_weight: 0.1

# Validation options
validation_plot_variables: ["t2m", "u10", "v10", "qpepre"]

# Output nc
output_nc: False
output_nc_freq: 5
