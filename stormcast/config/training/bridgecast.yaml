# General
outdir: 'StormCast_bridgecast'
experiment_name: 'bridgecast_full'
run_id: '0'
rundir: ./${training.outdir}/${training.experiment_name}/${training.run_id}
num_data_workers: 4
log_to_wandb: False
wandb_mode: "online"
seed: -1
cudnn_benchmark: True
resume_checkpoint: "latest"
initial_weights: ""

# Logging
print_progress_freq: 1
checkpoint_freq: 5000
validation_freq: 500

# Optimization (FlowCast-paper compatible: AdamW, lr=5e-4, wd=1e-4, cosine)
batch_size: 64
batch_size_per_gpu: "auto"
lr: 5E-4
weight_decay: 1.0E-4
adam_betas: [0.9, 0.999]
lr_warmup_steps: 4000
min_lr_ratio: 0.01
total_train_steps: 400000
clip_grad_norm: 1.0
loss: 'bridgecast'
fp_optimizations: fp32
compile_model: False

# Bridge parameters (plan §6).
sigma_bridge: 0.15            # σ_b — bridge noise (peaks at t=1/2)
sigma_anchor: 0.0             # σ_a — anchor jitter (0 ⇒ deterministic anchor)
t_eps: 1.0E-3                 # endpoint clip on [0, 1] for γ'(t) stability
ema_decay: 0.999

# Climatology-correlated noise prior (plan §2.3). Set
# white_noise_ablation: True to disable colouring (variant #4).
white_noise_ablation: False
psd_num_samples: 512

# Channel-adaptive qpepre path (plan §2.4).
qpepre_asinh: True
qpepre_kappa: 1.0             # asinh knee in standardized residual space
rain_threshold: 0.1           # mm/h threshold for the wet/dry mask target
enable_mask_head: True
apply_mask_gate: True
mask_threshold: 0.5
nonneg_qpepre: True

# Energy-Score ensemble objective (plan §2.6). Set es_K=0 to disable
# (variant #6 in the ablation table).
es_K: 4
es_pool: 4

# Loss weights (plan §2.8).
lambda_v: 1.0
lambda_m: 0.1
lambda_e: 0.5
lambda_d: 1.0E-3

# Channel weights and spectral regularizer (parity with FlowCast).
channel_weights: [1.0, 1.0, 1.0, 2.0]      # (t2m, u10, v10, qpepre)
spectral_channels: ["qpepre"]
spectral_weight: 0.1

# Soft physics priors (plan §2.7).
divergence_channels: ["u10", "v10"]         # null/empty disables the term

# Validation sampler (plan §3 Algorithm 1).
valid_num_steps: 2            # S — Heun-midpoint steps at validation
solver: 'midpoint'            # 'midpoint' or 'euler'

validation_plot_variables: ["t2m", "u10", "v10", "qpepre"]

output_nc: False
output_nc_freq: 5
