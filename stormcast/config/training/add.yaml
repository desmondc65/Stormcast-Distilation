# General training config items
outdir: 'StormCast_add'
experiment_name: 'add_distillation'
run_id: '0'
rundir: ./${training.outdir}/${training.experiment_name}/${training.run_id}
num_data_workers: 4
log_to_wandb: False
wandb_mode: "online"
seed: -1
cudnn_benchmark: True
resume_checkpoint: "latest"
initial_weights: ""

# Logging frequency
print_progress_freq: 1
checkpoint_freq: 5000
validation_freq: 500

# Optimization hyperparameters
batch_size: 64
batch_size_per_gpu: "auto"
lr_G: 1E-5              # Student (generator) learning rate
lr_D: 4E-5              # Discriminator learning rate
lr_rampup_steps: 1000
total_train_steps: 400000
clip_grad_norm: 1.0
loss: 'add'
fp_optimizations: fp32
compile_model: False

# ADD specific
num_student_steps: 1           # Number of denoising steps for the student (1-4)
lambda_distill: 2.5            # Weight for score distillation loss
r1_gamma: 0.00001             # Weight for R1 gradient penalty (1e-5, per ADD design)
use_nfsd: False                # Use Noise-Free Score Distillation
P_std: 1.2                    # Std for score distillation sigma sampling
ema_decay: 0.999              # Fixed EMA decay for student

# Discriminator architecture
disc_base_ch: 64               # Base channel width
disc_num_scales: 4             # Number of downsampling stages / heads
condition_discriminator: True  # Whether to condition discriminator on input state

# Validation options
validation_plot_variables: ["t2m", "u10", "v10", "qpepre"]

# Output nc
output_nc: False
output_nc_freq: 5
