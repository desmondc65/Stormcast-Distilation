# General training config items
outdir: 'StormCast_dmd'
experiment_name: 'dmd_distillation'
run_id: '0'
rundir: ./${training.outdir}/${training.experiment_name}/${training.run_id}
num_data_workers: 4
log_to_wandb: False
wandb_mode: "online"
seed: -1
cudnn_benchmark: True
resume_checkpoint: "latest"
initial_weights: ""

# Logging frequency
print_progress_freq: 1
checkpoint_freq: 5000
validation_freq: 500

# Optimization hyperparameters
batch_size: 64
batch_size_per_gpu: "auto"
lr: 1E-5              # Lower LR than CD -- DMD is more sensitive
lr_rampup_steps: 1000
total_train_steps: 400000
clip_grad_norm: 1.0
loss: 'dmd'
fp_optimizations: fp32
compile_model: False

# DMD specific
lambda_reg: 1.0            # Initial regression loss weight
lambda_reg_final: 0.0      # Final regression loss weight (annealed)
reg_anneal_steps: 200000   # Steps over which to anneal lambda_reg
num_teacher_steps: 18      # Teacher ODE steps for generating regression targets
rho: 7.0                   # Karras schedule exponent
P_std: 1.2                 # Std for score evaluation sigma sampling
use_dmd2: True             # Use DMD2 (no separate fake score network)
ema_decay: 0.999           # Fixed EMA decay

# Score evaluation noise range
score_sigma_min: 0.05
score_sigma_max: 10.0

# Validation options
validation_plot_variables: ["t2m", "u10", "v10", "qpepre"]

# Output nc
output_nc: False
output_nc_freq: 5
