# General training config items
outdir: 'StormCast_progressive'
experiment_name: 'prog_distillation'
run_id: '0'
rundir: ./${training.outdir}/${training.experiment_name}/${training.run_id}
num_data_workers: 4
log_to_wandb: False
wandb_mode: "online"
seed: -1
cudnn_benchmark: True
resume_checkpoint: "latest"
initial_weights: ""

# Logging frequency
print_progress_freq: 1
checkpoint_freq: 5000
validation_freq: 500

# Optimization hyperparameters
batch_size: 128
batch_size_per_gpu: "auto"
lr: 1E-4
lr_rampup_steps: 500
clip_grad_norm: 1.0
loss: 'progressive'
fp_optimizations: fp32
compile_model: False

# Progressive Distillation specific
initial_num_steps: 18     # Teacher's sampling steps (18 → 9 → 4 → 2 → 1)
target_num_steps: 1       # Stop distillation when student reaches this count
steps_per_phase: 50000    # Training steps per distillation phase
rho: 7.0                  # Karras schedule exponent
loss_weighting: 'edm' # 'uniform' or 'edm' per-sample weighting

# Validation options
validation_plot_variables: ["t2m", "u10", "v10", "qpepre"]

# Output nc
output_nc: False
output_nc_freq: 5
