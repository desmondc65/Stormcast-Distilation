# Main config for anchored Stochastic-Interpolant Bridge inference
# (regression mean as bridge prior endpoint; sampler integrates mu -> M).
# Mirrors flowcast_inference.yaml; loads the bridge student via EMA shadow.

defaults:
  - dataset/era5_rwrf_qpepre

  # Model settings shared with training (sigma_data, time_scale, conditions).
  - model/bridge

  # Inference settings (checkpoints, n_steps, plot vars, bridge sampler args).
  - inference/bridge

  # Hydra
  - hydra/default

  - _self_
