<text x="44" y="526.16" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#263238" font-weight="normal" text-anchor="start">map_layer MLP; forward = SongUNet(x, 0).</text>
<text x="44" y="541.66" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#263238" font-weight="normal" text-anchor="start">Every UNetBlock affine Linear(512→C) sees a</text>
<text x="44" y="557.16" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#263238" font-weight="normal" text-anchor="start">zero vector → bias-only shift (no time cond.).</text>
<text x="44" y="572.66" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#263238" font-weight="normal" text-anchor="start">Frozen ❄ in Stage 2 — runs under no_grad,</text>
<text x="44" y="588.16" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#263238" font-weight="normal" text-anchor="start">provides μ_t+1 to the condition bundle c.</text>
<text x="44" y="603.66" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#263238" font-weight="normal" text-anchor="start">Single self-attn: dec.12x12_in0 · 1 head.</text>
<rect x="30" y="849" width="1500" height="64" rx="6" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="1.2" opacity="1.0"/>
<text x="45" y="874" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#263238" font-weight="bold" text-anchor="start">UNetBlock (DDPM++ residual block, adaptive_scale=False):   x → GroupNorm(32, ε 1e-6) + SiLU → Conv 3×3 → ⊕ emb-shift → GroupNorm + SiLU → Dropout 0.1 → Conv 3×3 (init ×1e-5) → ⊕ skip (identity / 1×1 conv) → × 1/√2</text>
<text x="45" y="897" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#455A64" font-weight="normal" text-anchor="start">emb ≡ 0 here (zero embedding) → the ⊕ adds only the affine bias   ·   ↓2×/↑2× fold a [1,1] box-filter resample into conv0 + skip   ·   in0 additionally: → self-attn → × 1/√2</text>
<text x="30" y="941" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#546E7A" font-weight="normal" text-anchor="start">Σ params — encoder 26.73 M · decoder 51.64 M · spatial_emb 2.36 M · total 80,726,404 · measured by instantiation at (192, 96) · ModuleDict names use the y-resolution only (enc.192x192_* actually runs at 192×96)</text>
